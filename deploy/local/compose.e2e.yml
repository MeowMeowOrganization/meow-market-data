# Local E2E-only Redis instance. Does not flush or share the normal Redis cache.
services:
  redis-e2e:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - '127.0.0.1:6382:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
